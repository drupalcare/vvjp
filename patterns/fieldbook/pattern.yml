options:
  available_breakpoints: '992'
  section_height:
    value: 82
    unit: vh
  max_width: 360
  parallax_speed: 0.3
  scroll_effect: 'fade-scale'
  background_position: 'center'
  bg_animation_speed: 0.1
  bg_animation_easing: 'linear'
  overlay_color: '#f4f4f4'
