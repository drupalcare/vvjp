label: 'Horizon'
description: 'Full-height chapters; the photo rises in behind a slanted line and a huge title sits bottom left.'
weight: 0
stage: open
ground: dark
placement: neither
serves: [nonprofit, events, cultural]
options:
  available_breakpoints: '768'
  section_height:
    value: 100
    unit: vh
  max_width: 0
  parallax_speed: 0.35
  scroll_effect: 'fade'
  background_position: 'center'
  bg_animation_speed: 0.1
  bg_animation_easing: 'linear'
  overlay_color: '#0b0b0b'
  overlay_opacity: 0.3
  over_content_only: false
  disable_overlay: false
  enable_css: false
pictures:
  vvj_image:
    style: vvj_wide_1600
    responsive: false
needs:
  - 'Row style Fields. First field the image with the URL to image formatter (style vvj_wide_1600), then kicker (p.vvj-kicker), title (h3.vvj-title, not linked), summary (p.vvj-summary) and link (p.vvj-link).'
