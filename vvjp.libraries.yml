vvjp:
  css:
    theme:
      css/vvjp.css: { }
  js:
    js/vvjp-parallax-element.js: {}
    js/vvjp.js: {}
  dependencies:
    - core/drupal
    - core/drupal.ajax
    - core/drupalSettings
    - core/once
    - vvj_core/tokens
    - vvj_core/base
    - vvj_core/a11y
    - vvj_core/element-base

vvjp-style:
  css:
    theme:
      css/vvjp-style.css: { }

vvjp__all:
  css:
    theme:
      css/vvjp-all.css: { }

vvjp__576:
  css:
    theme:
      css/vvjp-576.css: { weight: 202 }

vvjp__768:
  css:
    theme:
      css/vvjp-768.css: { weight: 202 }

vvjp__992:
  css:
    theme:
      css/vvjp-992.css: { weight: 202 }

vvjp__1200:
  css:
    theme:
      css/vvjp-1200.css: { weight: 202 }

vvjp__1400:
  css:
    theme:
      css/vvjp-1400.css: { weight: 202 }

# Patterns. Each depends on vvjp/vvjp so its CSS loads after the module CSS.
vvjp-pattern-base:
  css:
    theme:
      patterns/vvjp-pattern-base.css: { weight: 205 }
  dependencies:
    - vvjp/vvjp
    - vvj_patterns/base

# Theme bridges: token mapping only, added to vvjp-pattern-base by the
# vvj_patterns library alter when Solo or APEX is the active theme.
pattern-bridge-solo:
  css:
    theme:
      patterns/bridge/vvjp-bridge-solo.css: { weight: 206 }

pattern-bridge-apex:
  css:
    theme:
      patterns/bridge/vvjp-bridge-apex.css: { weight: 206 }

pattern.horizon:
  css:
    theme:
      patterns/horizon/vvjp-horizon.css: { weight: 210 }
  dependencies:
    - vvjp/vvjp-pattern-base

pattern.skyline:
  css:
    theme:
      patterns/skyline/vvjp-skyline.css: { weight: 210 }
  dependencies:
    - vvjp/vvjp-pattern-base

pattern.showroom:
  css:
    theme:
      patterns/showroom/vvjp-showroom.css: { weight: 210 }
  dependencies:
    - vvjp/vvjp-pattern-base

pattern.shoreline:
  css:
    theme:
      patterns/shoreline/vvjp-shoreline.css: { weight: 210 }
  dependencies:
    - vvjp/vvjp-pattern-base

pattern.fieldbook:
  css:
    theme:
      patterns/fieldbook/vvjp-fieldbook.css: { weight: 210 }
  dependencies:
    - vvjp/vvjp-pattern-base
